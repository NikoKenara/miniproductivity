<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Productivity</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header Utama -->
      <div class="header-container">
        <h1>My To-Do List <span class="author-tag">by NikoKenara</span></h1>
        <button id="btn-open-form">+</button>
      </div>

      <!-- Container 1: On-Going Tasks (Scrollable) -->
      <div class="task-scroll-area">
        <ul id="pending-list" class="task-list"></ul>
      </div>

      <!-- Container 2: Completed Tasks (Terpisah & Collapsible) -->
      <div class="completed-container">
        <div
          id="completed-header"
          class="completed-header"
          onclick="toggleCompletedSection()"
        >
          <h2>Selesai (<span id="completed-count">0</span>)</h2>
          <span id="completed-arrow" class="arrow-icon">▼</span>
        </div>
        <div id="completed-body" class="completed-body">
          <ul id="completed-list" class="task-list"></ul>
        </div>
      </div>
    </div>

    <!-- Modal Popup Form Input Task -->
    <div id="form-modal" class="modal hidden">
      <div class="modal-content">
        <h3>Tambah Task Baru</h3>
        <form id="task-form">
          <input
            type="text"
            id="task-input"
            placeholder="Judul task..."
            required
          />
          <input
            type="text"
            id="task-short-desc"
            placeholder="Short description (opsional)..."
          />
          <textarea
            id="task-long-desc"
            placeholder="Long description / catatan detail (opsional)..."
            rows="3"
          ></textarea>

          <!-- Input Deadline Baru -->
          <label style="font-size: 0.75rem; color: #666; font-weight: 600"
            >Deadline (Opsional):</label
          >
          <input type="datetime-local" id="task-deadline" />

          <div class="modal-actions">
            <button type="submit" class="btn-primary">Tambah Task</button>
            <button type="button" id="btn-close-form" class="btn-secondary">
              Batal
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal Popup Edit Timer -->
    <!-- Modal Custom Timer -->
    <div id="timer-modal" class="modal hidden">
      <div class="modal-content">
        <h3>Set Custom Timer</h3>
        <div
          class="custom-timer-inputs"
          style="display: flex; gap: 8px; margin: 15px 0"
        >
          <div style="flex: 1">
            <label style="font-size: 0.75rem; color: #666">Jam</label>
            <input
              type="number"
              id="timer-hours"
              min="0"
              max="23"
              value="0"
              style="
                width: 100%;
                padding: 8px;
                border-radius: 6px;
                border: 1px solid #ccc;
              "
            />
          </div>
          <div style="flex: 1">
            <label style="font-size: 0.75rem; color: #666">Menit</label>
            <input
              type="number"
              id="timer-minutes"
              min="0"
              max="59"
              value="0"
              style="
                width: 100%;
                padding: 8px;
                border-radius: 6px;
                border: 1px solid #ccc;
              "
            />
          </div>
          <div style="flex: 1">
            <label style="font-size: 0.75rem; color: #666">Detik</label>
            <input
              type="number"
              id="timer-seconds"
              min="0"
              max="59"
              value="0"
              style="
                width: 100%;
                padding: 8px;
                border-radius: 6px;
                border: 1px solid #ccc;
              "
            />
          </div>
        </div>
        <div class="modal-actions">
          <button id="btn-save-timer" class="btn-primary">Simpan Timer</button>
          <button id="btn-close-timer-modal" class="btn-secondary">
            Batal
          </button>
        </div>
      </div>
    </div>

    <!-- Modal Popup Detail (Read-Only) -->
    <div id="desc-modal" class="modal hidden">
      <div class="modal-content">
        <h3 id="modal-task-title">Detail Task</h3>
        <span id="modal-task-time" class="modal-timestamp"></span>

        <div class="detail-section">
          <label>Short Description:</label>
          <p id="modal-short-desc-text"></p>
        </div>

        <div class="detail-section">
          <label>Catatan Detail:</label>
          <textarea id="modal-long-desc-input" rows="5" readonly></textarea>
        </div>

        <!-- Container Box Overdue Permanen -->
        <div id="modal-overdue-box" class="detail-section hidden">
          <label style="color: #ef4444">Status Overdue:</label>
          <p
            id="modal-overdue-text"
            style="color: #ef4444; font-weight: 600"
          ></p>
        </div>

        <div class="modal-actions">
          <button id="btn-close-modal" class="btn-secondary">Tutup</button>
        </div>
      </div>
    </div>

    <!-- Toast Container untuk Notifikasi Overdue -->
    <div id="toast-container" class="toast-container"></div>

    <script src="app.js"></script>
  </body>
</html>
